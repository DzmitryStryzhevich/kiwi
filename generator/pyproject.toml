[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwicgen"
dynamic = ["version"]
description = "KIWI component-scoped OSAL code generator"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0.2,<7",
    "colorama>=0.4.6,<1",
    "clang-format>=22,<23",
]

[project.optional-dependencies]
executable = [
    "pyinstaller>=6,<7",
]

[project.scripts]
kiwicgen = "kiwicgen_cli:main"

[tool.setuptools]
py-modules = [
    "kiwicgen_core",
    "kiwicgen_cli",
    "kiwicgen_gui",
    "kiwicgen_version",
]

[tool.setuptools.dynamic]
version = {attr = "kiwicgen_version.__version__"}
