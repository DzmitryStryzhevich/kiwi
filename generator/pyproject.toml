[build-system]
requires = ["setuptools>=77,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "kiwicgen"
dynamic = ["version"]
description = "KIWI component-scoped OSAL code generator"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0.2,<7",
    "colorama>=0.4.6,<1",
    "clang-format>=22,<23",
    "packaging>=24",
]

[project.optional-dependencies]
executable = [
    "pyinstaller>=6,<7",
]

[project.scripts]
kiwicgen = "cli.main:main"

[project.gui-scripts]
kiwicgen-gui = "gui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "formatter*", "cli*", "gui*"]

[tool.setuptools.dynamic]
version = {attr = "core.version.__version__"}
