5-generator-test:
  extends: .test-base
  script:
    - .gitlab/scripts/test_generator.sh
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit: build/test-generator/junit.xml
    paths:
      - build/test-generator/Testing/

